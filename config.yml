agent_id: murasame
platforms:
  bilibili:
    enabled: true  # legacy default; disabled modules create no protocol clients
owner_history:
  enabled: false  # enabled after owner QR login; never reuse AI credentials
  poll_seconds: 300
  pages: 3
  retention_days: 7
  window_minutes: 120
  context_limit: 12
  use_for_private: true
  diary_enabled: true  # private reflections at memory.review_time; never public facts
  playful_jealousy: false
  recommendations_enabled: false
  recommendation_topics: [galgame, 千恋万花]
  recommendation_daily_limit: 1
  recommendation_gap_minutes: 360
owner_person_id: owner
social:
  enabled: true
  public_posts_enabled: true  # still requires autonomy.dynamic_enabled
  private_feelings_public: true  # owner consent: only generic feelings, no private facts
  ttl_hours: 24
  retention_days: 7
  context_limit: 6
  max_active_states: 20
  max_followups: 2
  followup_min_minutes: 15
  followup_max_minutes: 720
  followup_gap_minutes: 120
requests:
  read_gap_seconds: 1.0
  read_max_wait_seconds: 5.0
  account_cache_seconds: 60
  backoff_seconds: 60
  backoff_max_seconds: 900
  quiet_before_seconds: 60
  quiet_after_seconds: 15
  log_retention_days: 7
  log_max_rows: 20000
database: data/murasame.sqlite3
character_source: character/settings.yml
character_profile: character/text_profile.yml
mode: reviewed  # reviewed: model approves, otherwise human draft; draft: all manual; auto: no model review
review:
  strategy: inline  # inline: verdict during generation; independent: a separate review call
paused: false
timezone: Asia/Hong_Kong
text_language: zh
network:
  proxy_enabled: true
  proxy_url: http://127.0.0.1:7890  # HTTP + HTTPS CONNECT; alternatively socks5://127.0.0.1:7890
  proxy_mode: gfwlist  # Only matching URLs use the proxy; all is an optional override.
  gfwlist_url: https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt
  gfwlist_cache: data/gfwlist.txt
  gfwlist_refresh_hours: 6
  # These domains and subdomains always connect directly, before list matching.
  direct_domains: [bilibili.com, b23.tv, biliapi.com, biliapi.net, bilivideo.com, hdslb.com, biliimg.com, qq.com, wechat.com, weixin.com, qpic.cn, qlogo.cn, gtimg.com, gtimg.cn]
model:
  base_url: ${MURASAME_MODEL_BASE_URL}
  name: ${MURASAME_MODEL_NAME}
  api_key: ${MURASAME_MODEL_API_KEY}
  timeout_seconds: 60
  daily_call_limit: 150
  max_context_characters: 18000
  max_output_tokens: null  # omit max_tokens; use the model service's official default
processing:
  model_concurrency: 4  # shared by concurrent reply generation, reviews and vision
memory:
  enabled: true
  recent_messages: 20  # messages, not full dialogue turns
  recall_limit: 8
  context_characters: 12000  # estimated input budget in characters, not tokens
  summary_messages: 40
  batch_messages: 80
  input_characters: 24000
  pressure_ratio: 0.75
  review_time: '23:00'
  daily_call_limit: 10  # also charged against model.daily_call_limit
  retry_minutes: 10
vision:
  enabled: true
  video_frames_enabled: true  # player-preview sprites only; no video download
  video_frame_count: 6  # total across parts; also capped by max_images
  video_frame_max_parts: 3  # sample the first 1-3 parts
  base_url: ${MURASAME_VISION_BASE_URL}  # blank: reuse the configured text service
  name: ${MURASAME_VISION_MODEL_NAME}  # blank: reuse model.name; must support image input
  api_key: ${MURASAME_VISION_API_KEY}  # blank with the same service: reuse model.api_key
  max_images: 9
  max_image_bytes: 8388608
  max_total_bytes: 25165824
  cache_minutes: 1440
  failure_retry_minutes: 10
  detail: auto
  allowed_image_hosts: [i0.hdslb.com, i1.hdslb.com, i2.hdslb.com, bimp.hdslb.com]
bilibili:
  credentials: .secrets/bilibili.json
  robot_uid: ""  # optional expected UID, checked against the logged-in account
  poll_seconds: 90  # owner publications; independently throttled
  reply_poll_seconds: 15  # comment/@ notifications; private inbox has an independent cadence
  private_poll_seconds: 30  # independent private inbox cadence
  notification_pages: 3
  inbox_batch_limit: 90  # latest unique messages per inbox poll; overflow is a dashboard warning
  notification_max_age_hours: 24
  private_messages_enabled: true  # only verified mutual followers; no owner exception
  private_session_pages: 3
  private_message_pages: 3
  private_message_max_age_hours: 24
  read_video_subtitles: true  # combine available subtitles with title + description; otherwise metadata only
  owner_new_videos: true
  owner_new_dynamics: true
  repost_owner_videos: true
  repost_owner_dynamics: true
bindings:
  - person_id: owner
    platform: bilibili
    external_id: ${MURASAME_OWNER_UID}  # set in .env or override bindings in config.local.yml
    display_name: ""  # fetched before a real @; never guessed from the persona
    purpose: owner_video_recommendation
artwork:
  enabled: false
  delivery: image  # image / link / local; image requires an explicit permission below
  times: ["12:30", "20:30"]
  weekdays: [0, 1, 2, 3, 4, 5, 6]
  grace_minutes: 30  # do not replay missed slots after long downtime
  candidate_limit: 8
  max_caption_characters: 100
  keywords: [千恋万花, 丛雨]
  sources: [pixiv]  # pixiv / x; X requires an official API bearer token
  pixiv_session: ${MURASAME_PIXIV_SESSION}
  x_bearer_token: ${MURASAME_X_BEARER_TOKEN}
  permissions: []  # local supplementary guide: ../docs/新增功能配置.md; attribution alone is not permission
engagement:
  video_like: true
  video_coin: true  # exactly one coin per video; skip if balance < 1 or already coined
  dynamic_like: true
expressions:
  enabled: true
  kaomoji_enabled: true  # optional text face; at most one, shares the total below
  max_per_message: 2  # model may choose none; never more than two
  cache_minutes: 360
  preferred_keywords: [千恋万花, 丛雨]
browsing:
  enabled: false
  allow_metadata_video: true
  comment_videos: true
  reply_comments: true
  recommend_owner: true
  recommendation_only: true  # ordinary proactive comments/replies are disabled
  min_video_views: 8000  # strict >, unknown counts cannot qualify
  min_video_comments: 20  # strict >; includes explicit tasks and private recommendations
  weekdays: [0, 1, 2, 3, 4, 5, 6]  # Monday = 0
  windows:
    - start: "19:00"
      end: "21:00"
  interval_minutes: 60
  categories: []  # select IDs using `murasame categories`; empty disables general exploration
  videos_per_round: 2
  candidate_limit: 6
  interests: [游戏开发, 人工智能]
  owner_interests: []
limits:
  daily_comments: 20
  daily_recommendations: 3
  min_send_gap_seconds: 10
  recommendation_gap_minutes: 120
  action_ttl_minutes: 30
  request_expiry_days: 7
  max_task_attempts: 3
  max_comment_characters: 250
  max_private_characters: 400
  max_recommendation_characters: 80
  max_event_attempts: 3
  event_retry_seconds: 60  # Fixed delay after each generation/read failure; never retries ambiguous writes.
web:
  host: 127.0.0.1
  port: 8766


# Autonomous initiatives; enable in the dashboard after reviewing these limits.
autonomy:
  dynamic_enabled: false
  private_enabled: false
  decision_interval_minutes: 30
  daily_decision_limit: 8
  max_delay_minutes: 120
  dynamic_daily_limit: 1
  private_daily_limit: 2
  dynamic_gap_minutes: 360
  private_gap_minutes: 240
  private_idle_minutes: 60
  max_post_characters: 300
  windows:
    - {start: '09:00', end: '22:00'}
  weekdays: [0, 1, 2, 3, 4, 5, 6]
  topics: ['游戏与创作', '生活中的小想法']
