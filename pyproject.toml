[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murasamebot"
version = "0.1.0"
description = "Platform-independent social agent with a Bilibili adapter"
requires-python = ">=3.12"
dependencies = ["httpx[socks]>=0.28,<1", "PyYAML>=6,<7", "tzdata>=2024.1", "Pillow>=11,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
login = ["qrcode[pil]>=7.4"]
voice = ["sounddevice>=0.5,<1"]
call-video = ["Pillow>=11.2.1,<14", "pyvirtualcam>=0.12,<1", "numpy>=1.26,<3"]

[project.scripts]
murasame = "murasamebot.bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"murasamebot.bootstrap" = ["dashboard.html", "dashboard.css", "owner-history.js", "request-controls.js", "social-state.js", "console-common.js", "bilibili-console.js", "qq-console.js", "shared-memory.js", "receivers.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

